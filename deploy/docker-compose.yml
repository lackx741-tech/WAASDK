## IntegratedDEX WaaS Platform — Production Docker Compose
##
## Usage:
##   1. cd deploy/
##   2. cp .env.example .env && nano .env  (fill in your values)
##   3. ./setup.sh yourdomain.com          (first-time SSL setup)
##   4. docker compose up -d               (start everything)
##
## Stack: Nginx (SSL) → Fastify API + Console UI → MongoDB

services:
  # ── API Server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/waassdk
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx (Reverse Proxy + SSL + Serves Console) ────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot-webroot:/var/www/certbot:ro
      - ../console:/var/www/console:ro
      - ../landing:/var/www/landing:ro
      - ../sdk/embed:/var/www/sdk/embed:ro
    depends_on:
      - api
    networks:
      - internal

  # ── Certbot (SSL auto-renewal) ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  mongo_data:

networks:
  internal:
    driver: bridge
